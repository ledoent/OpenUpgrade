# Fork-only variant of test-migration.yml that exercises the migration
# against the enriched 18.0 seed (OCA's 18.0.psql + populate-factory
# volume + curated edge cases from scripts/seed-edge-cases.py in the
# lab repo). Built and uploaded by scripts/build-fork-seed.sh.
#
# Catches migration regressions on edge-case data that OCA's vanilla
# demo seed doesn't contain — VATEX_ legacy codes, crm.stage with
# team_id set, archived parents, etc.
#
# Runs in parallel with `test-migration.yml` so a green build means
# both the upstream baseline AND our enriched seed migrate cleanly.

name: Test OpenUpgrade migration (enriched seed)

on:
  push:
    branches:
      - "19.0"
      - "19.0-ocabot-*"
      - "19.0-mig-*"
      - "19.0-fix-*"
      - "aggregated"
      - "ledoent"

jobs:
  test:
    # Fork-only: OCA upstream doesn't have our enriched seed.
    if: ${{ github.repository_owner == 'ledoent' }}
    runs-on: ubuntu-22.04
    env:
      DB: "openupgrade"
      DB_HOST: "localhost"
      DB_PASSWORD: "odoo"
      DB_PORT: 5432
      DB_USERNAME: "odoo"
      # Enriched seed lives on ledoent/OpenUpgrade `databases` release.
      DOWNLOADS: https://github.com/ledoent/OpenUpgrade/releases/download/databases
      SEED_NAME: 18.0-ledoent.psql
      ODOO: "./odoo/odoo-bin"
      PGHOST: "localhost"
      PGPASSWORD: "odoo"
      PGUSER: "odoo"
      OPENUPGRADE_USE_DEMO: "yes"
    services:
      postgres:
        # PG16 to match the lab's local postgres used by build-fork-seed.sh.
        # PG14 in OCA's test-migration.yml can't restore custom-format dumps
        # written by PG16 (file header version 1.15 vs max-supported 1.14).
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo
        ports:
          - 5432:5432
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Sleep for 10 seconds
        run: sleep 10s
      - name: Provision and restore the enriched migration DB
        # Install client, raise the lock limit, create + restore in ONE step:
        # some "oca forks" self-hosted runners use a fresh container per `run:`,
        # so a postgresql-client installed in an earlier step is gone by
        # `createdb` (exit 127, "command not found"). Keeping install → createdb
        # → restore together guarantees the client is present where it's used.
        # NB: PG16 bin must go on PATH in-step (export, not $GITHUB_PATH, which
        # only affects *later* steps) since pg_restore must read PG16 dumps.
        run: |
          # Ubuntu 22.04 ships pg_restore v14 — can't read PG16 custom-format
          # dumps from the lab's local postgres:16. Install matching client.
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget -q -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          # the 226-module _process_end unlink sweep exhausts the default 64
          # max_locks_per_transaction ("out of shared memory" at the end of an
          # otherwise complete migration)
          psql -d postgres -c "ALTER SYSTEM SET max_locks_per_transaction = 1024"
          docker restart ${{ job.services.postgres.id }}
          until pg_isready -h localhost -U odoo; do sleep 1; done
          createdb $DB
          wget -q -O- $DOWNLOADS/$SEED_NAME | pg_restore -d $DB --no-owner
          psql $DB -c "UPDATE ir_module_module SET demo=False"
          # cloud_storage_google (installed in this seed) gains a hard google-auth
          # external dependency in 19.0, and google-auth's cryptography>=38 is
          # incompatible with Odoo 18's pinned pyopenssl/urllib3 stack (it breaks
          # `import OpenSSL`, so base won't load). Nothing depends on it, so skip it:
          # mark uninstalled pre-migration so OpenUpgrade doesn't load/upgrade it.
          # Its 18->19 change needs live Google config to exercise anyway.
          psql $DB -c "UPDATE ir_module_module SET state='uninstalled' WHERE name = 'cloud_storage_google'"
      - name: Check out Odoo
        uses: actions/checkout@v4
        with:
          repository: odoo/odoo
          ref: "19.0"
          fetch-depth: 1
          path: odoo
      - name: Check out previous Odoo
        uses: actions/checkout@v4
        with:
          repository: odoo/odoo
          ref: "18.0"
          fetch-depth: 1
          path: odoo-old
      - name: Check out OpenUpgrade
        uses: actions/checkout@v4
        with:
          path: openupgrade
      - name: Configuration
        run: |
          sudo apt update
          sudo apt install \
              expect \
              expect-dev \
              libevent-dev \
              libldap2-dev \
              libsasl2-dev \
              libxml2-dev \
              libxslt1-dev \
              nodejs \
              python3-lxml \
              python3-passlib \
              python3-psycopg2 \
              python3-serial \
              python3-simplejson \
              python3-werkzeug \
              python3-yaml \
              unixodbc-dev
      - name: Requirements Installation
        run: |
          sed -i -E "s/(gevent==)21\.8\.0( ; sys_platform != 'win32' and python_version == '3.10')/\122.10.2\2/;s/(greenlet==)1.1.2( ; sys_platform != 'win32' and python_version == '3.10')/\12.0.2\2/" odoo/requirements.txt
          pip install -q -r odoo/requirements.txt
          # Workaround for an upstream core bug (mirrors test-migration.yml):
          # l10n_es_edi_verifactu's models/certificate.py does `_inherit =
          # 'certificate.certificate'` but its manifest only declares
          # `depends: ['l10n_es']`. The enriched seed force-updates verifactu
          # (it joins MODULES_NEW), so the registry build dies with
          # `Model 'certificate.certificate' does not exist in registry`. Add
          # the missing manifest dependency on the fresh odoo checkout.
          # Submitted upstream as odoo/odoo#271120; no-op once 19.0 has it.
          vfm=$(find odoo -path '*/l10n_es_edi_verifactu/__manifest__.py' | head -1)
          [ -n "$vfm" ] && sed -i "s/'depends': \['l10n_es'\],/'depends': ['l10n_es', 'certificate'],/" "$vfm"
          pip install -r ./openupgrade/requirements.txt
          pip install -U git+https://github.com/oca/openupgradelib
          # this is for v18 l10n_eg_edi_eta which crashes without it
          pip install asn1crypto
          # required by v18
          pip install decorator
          pip install coverage
          # this is for account_peppol
          pip install phonenumbers
          # NB: google-auth is intentionally NOT installed here. It needs
          # cryptography>=38, which evicts Odoo's pinned cryptography 3.4.8 and
          # breaks the matched pyopenssl 21 / urllib3 1.26 stack (base won't
          # import). cloud_storage_google/google_gmail (enriched seed only) need
          # it — handle their dep without disturbing the base crypto stack.
          pip install geoip2
      - name: Test data
        run: |
          if test -n "$(ls openupgrade/openupgrade_scripts/scripts/*/tests/data*.py 2> /dev/null)"; then
             for snippet in openupgrade/openupgrade_scripts/scripts/*/tests/data*.py; do
               odoo-old/odoo-bin shell -d $DB < $snippet
             done
          fi
      - name: OpenUpgrade test (enriched)
        id: run_migration
        run: |
          # select modules and perform the upgrade
          MODULES_OLD=$(\
              sed -n '/^+========/,$p' \
              openupgrade/docsource/modules180-190.rst \
              | grep "Done\|Partial\|Nothing" \
              | grep -v "theme_" \
              | sed -rn 's/((^\| *\|del\| *)|^\| *)([0-9a-z_]*)[ \|].*/\3/g p' \
              | sed '/^\s*$/d' \
              | paste -d, -s)
          MODULES_NEW=$(\
              sed -n '/^+========/,$p' \
              openupgrade/docsource/modules180-190.rst \
              | grep "Done\|Partial\|Nothing" \
              | grep -v "theme_" \
              | sed -rn 's/((^\| *\|new\| *)|^\| *)([0-9a-z_]*)[ \|].*/\3/g p' \
              | sed '/^\s*$/d' \
              | paste -d, -s)
          echo "modules_old=$MODULES_OLD" >> $GITHUB_OUTPUT
          echo "modules_new=$MODULES_NEW" >> $GITHUB_OUTPUT
          if [ -z "$MODULES_NEW" ]; then
             echo "No modules to test yet"
             exit
          fi
          REQUEST="update ir_module_module set state='uninstalled' \
              where name not in ('$(echo $MODULES_OLD | sed -e "s/,/','/g")')"
          echo Set the modules as not installable if they are not in the following list : $MODULES_OLD
          echo Running $REQUEST
          psql $DB -c "$REQUEST"
          ADDONS_PATHS="\
              $GITHUB_WORKSPACE/odoo/addons \
              $GITHUB_WORKSPACE/odoo/odoo/addons \
              $GITHUB_WORKSPACE/openupgrade"
          echo Execution of Openupgrade with the update of the following modules : $MODULES_NEW
          $ODOO \
              --addons-path=`echo $ADDONS_PATHS | awk -v OFS="," '$1=$1'` \
              --database=$DB \
              --db_host=$DB_HOST \
              --db_password=$DB_PASSWORD \
              --db_port=$DB_PORT \
              --db_user=$DB_USERNAME \
              --load=base,web,openupgrade_framework \
              --test-enable \
              --test-tags openupgrade \
              --log-handler odoo.models.unlink:WARNING \
              --stop-after-init \
              --without-demo=$MODULES_NEW \
              --update=$MODULES_NEW
