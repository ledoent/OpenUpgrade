name: Build openupgrade image

# Builds an Odoo 19 image with the aggregated OpenUpgrade tree baked in
# and pushes to Google Artifact Registry (GAR). Mirrors the pattern used
# by ledoent's openobserve and erp builds: Workload Identity Federation —
# no stored secrets.
#
# Image: europe-west3-docker.pkg.dev/kendall-ledo/docker/openupgrade
# Consumed by: openupgrade-lab/docker-compose.yml (odoo-19 service)

on:
  push:
    branches:
      - aggregated
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  GAR_HOST: europe-west3-docker.pkg.dev
  GAR_IMAGE: europe-west3-docker.pkg.dev/kendall-ledo/docker/openupgrade

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aggregated
          fetch-depth: 1

      - id: auth
        name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/852639431500/locations/global/workloadIdentityPools/github/providers/ledoent
          service_account: ci-github@kendall-ledo.iam.gserviceaccount.com
          token_format: access_token

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.openupgrade
          push: true
          tags: |
            ${{ env.GAR_IMAGE }}:latest
            ${{ env.GAR_IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.GAR_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.GAR_IMAGE }}:buildcache,mode=max
