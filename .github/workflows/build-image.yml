name: Build openupgrade image

on:
  push:
    branches:
      - aggregated
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout aggregated
        uses: actions/checkout@v4
        with:
          ref: aggregated
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Zot (registry.ledoweb.com)
        uses: docker/login-action@v3
        with:
          registry: registry.ledoweb.com
          username: ${{ secrets.ZOT_USERNAME }}
          password: ${{ secrets.ZOT_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.openupgrade
          push: true
          tags: |
            registry.ledoweb.com/openupgrade:latest
            registry.ledoweb.com/openupgrade:${{ github.sha }}
          cache-from: type=registry,ref=registry.ledoweb.com/openupgrade:buildcache
          cache-to: type=registry,ref=registry.ledoweb.com/openupgrade:buildcache,mode=max
